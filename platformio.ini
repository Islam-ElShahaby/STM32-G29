; G29 Force-Feedback USB Host on STM32 BlackPill (F411CE)
; Native USB OTG-FS host — no MAX3421E needed.
;
; This uses the STM32Cube HAL + ST USB Host *Core* library (pulled from the
; framework package by scripts/usb_host_middleware.py).  We do NOT use ST's
; stock HID class driver — it bails on non-boot HID devices (gamepads/wheels).
; Instead a small custom USBH class lives in src/g29_hid.c.

[platformio]
default_envs = blackpill_f401cc

[env:blackpill_f401cc]
platform = ststm32
board = blackpill_f401cc
framework = stm32cube

upload_protocol = stlink
debug_tool = stlink
build_type = debug

; We provide our own stm32f4xx_hal_conf.h (enables HAL_HCD module)
board_build.stm32cube.custom_config_header = yes

; USB Host Core is added explicitly by scripts/usb_host_middleware.py, so we
; don't want the Library Dependency Finder to also compile it from the include
; path (it would redundantly build the Core + usbh_conf_template.c).
lib_ldf_mode = off

; The FreeRTOS ARM_CM4F port saves the FPU registers on context switch, so it
; needs the hardware FPU actually enabled. PlatformIO defaults this board to
; -mcpu=cortex-m4 with no FPU, which makes port.c fail to assemble. Enabling it
; also lets CMSIS SystemInit() turn on CPACR, so float is genuinely usable.
build_flags =
    -D HSE_VALUE=25000000
    -D USE_HAL_DRIVER
    -I include
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -Og -g3

build_unflags =
    -mfloat-abi=soft

extra_scripts = pre:scripts/usb_host_middleware.py
